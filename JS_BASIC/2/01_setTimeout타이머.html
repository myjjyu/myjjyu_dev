<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>서브메뉴_classList다루기</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../1/css/06_서브메뉴_classList다루기.css" />
  </head>
  <body>
    <!-- login modal -->
    <div class="black-bg">
      <div class="white-bg">
        <h4>please login</h4>
        <form action="success.html">
          <div class="my-3">
            <input
              type="text"
              class="form-control"
              id="email"
              placeholder="아이디를 입력하세요"
            />
          </div>
          <div class="my-3">
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="비밀번호를 입력하세요"
            />
          </div>
          <button type="submit" class="btn btn-primary">전송</button>
          <button type="button" class="btn btn-danger" id="close">닫기</button>
        </form>
      </div>
    </div>

    <nav class="navbar navbar-light bg-light">
      <div class="container-fluid">
        <span class="navbar-brand">Navbar</span>
        <span class="badge bg-dark">Dark🔁</span>
        <button class="navbar-toggler" type="button">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </nav>

    <ul class="list-group">
      <li class="list-group-item">An item</li>
      <li class="list-group-item">A second item</li>
      <li class="list-group-item">A third item</li>
      <li class="list-group-item">A fourth item</li>
      <li class="list-group-item">And a fifth one</li>
    </ul>

    <div class="main-bg">
      <h4>Shirts on Sale</h4>
      <button id="loginButton" class="btn btn-danger">로그인</button>
    </div>

    <div class="alert alert-danger">
      <span>5</span>초 이내 구매시 사은품 증정!
    </div>

    <!-- 부트스트랩 라이브러리 -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- 제이쿼리 라이브러리 -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>

    <script>
      $(".navbar-toggler").on("click", function () {
        $(".list-group").toggleClass("show");
      });
      // ✅ toggle() 메서드는 클래스가 없으면 추가하고, 있으면 제거한다.

      /**
       * login 모달창
       * login click 하면 모달창 띄우기
       *
       */
      document
        .querySelector("#loginButton")
        .addEventListener("click", function () {
          document.querySelector(".black-bg").classList.add("show");
        });

      // 띄어진 모달창 close누르면 닫기
      document.querySelector("#close").addEventListener("click", function () {
        document.querySelector(".black-bg").classList.remove("show");
      });

      // if~else(조건)문
      document
        .querySelector(".btn-primary")
        .addEventListener("click", function (e) {
          if (document.querySelector("#email").value === "") {
            e.preventDefault();
            alert("아이디를 입력하세요");
          } else if (
            document.querySelector("#email").value.indexOf("@") === -1
          ) {
            e.preventDefault();
            alert("이메일 형식이 아닙니다.");
          } else if (document.querySelector("#password").value === "") {
            e.preventDefault();
            alert("비밀번호를 입력하세요");
          } else if (document.querySelector("#password").value.length < 6) {
            e.preventDefault();
            alert("비밀번호는 6자리 이상이어야 합니다.");
          }
        });

      /**
       * Dark mode 버튼
       * badge 클릭횟수가 홀수면 내부 글자를 light로 변경
       * badge 클릭횟수가 짝수면 내부 글자를 dark로 변경
       */

      // 1. 클릭횟수 담을 변수 정의
      let count = 0;

      // 2. badge 클릭횟수가 홀수면 내부 글자를 클릭하면 횟수 증가
      document.querySelector(".badge").addEventListener("click", function () {
        count++;

        console.log(count);

        // 3. badge 클릭횟수가 짝수면 내부 글자가 다크모드
        if (count % 2 == 0) {
          document.querySelector(".badge").innerHTML = "Dark🔁";

          // 4. badge 클릭횟수가 홀수면 내부 글자가 라이트모드
        } else {
          document.querySelector(".badge").innerHTML = "Light🔁";
        }
      });
    </script>

    <script>
      // 5초 이내 구매시 사은품 증정 알림창 1초씩 줄어들다가 사라지기
      let countNum = 5;

      let interval = setInterval(function () {
        countNum--;

        if (countNum >= 1) {
          document.querySelector(".alert span").innerHTML = countNum;
        }
        if (countNum < 1) {
          clearInterval(interval);
          document.querySelector(".alert").style.display = "none";
        }
      }, 1000);
    </script>
  </body>
</html>
