<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/house.css" />
    <title>Home</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">집꾸미기</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">스토어</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">시공견적</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    
    <div id="content">
      <div>
        <input type="text" id="search" placeholder="검색어 입력" />
        <button id="searchBtn">검색</button>
      </div>

      <div id="product-list" class="product-list product">
        <!-- <div class="card" style="width: 18rem;">
      <img src="../img/pr1.JPG" class="card-img-top">
      <div class="card-body">
        <h5 class="card-title">식기세척기</h5>
        <p class="card-text">세척나라</p>
        <p class="card-text">가격 : 10000</p>
        <button>담기</button>
      </div> -->
      </div>
    </div>

    <!-- 구매하기 modal -->
    <div class="black-bg">
      <div class="white-bg">
        <form action="success.html">
          <div class="my-3">
            성함
            <input
              type="text"
              class="form-control"
              id="email"
              placeholder="성함을 입력하세요"
            />
          </div>
          <div class="my-3">
            연락처
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="연락처를 입력하세요"
            />
          </div>
          <button type="submit" class="btn btn-primary">입력완료</button>
          <button type="button" class="btn btn-danger" id="close">닫기</button>
        </form>
      </div>
    </div>

    <div class="cart-container">
      <div class="carttext">장바구니</div>
      <div
        id="cart1"
        class="cart"
        ondrop="drop(event)"
        ondragover="allowDrop(event)"
      >
        <p>여기로 드래그 해주세요</p>
      </div>

      <div class="total">
        <p>최종가격</p>
        <div class="totalprice">합계 : 0</div>
        <button class="totalBtn">구매하기</button>
      </div>
    </div>

    <!-- 부트스트랩 라이브러리 -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- 제이쿼리 라이브러리 -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>

    <script src="../js/house.js"></script>
  </body>
</html>
