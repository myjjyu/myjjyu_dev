<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./css/02_AlertBox.css">
</head>
<body>
<!-- 열기버튼 -->
<div class="alert-box" id="alert">Hello~Javascript Alert box!!
  <!-- 닫기버튼 -->
  <button class="closebutton" onclick="document.querySelector('#alert').style.display='none'">❎</button>
</div>

<button class="clickbutton" onclick="document.getElementById('alert').style.display='block'">Click</button>
</body>
</html>
