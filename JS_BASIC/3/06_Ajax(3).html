<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>서브메뉴_classList다루기</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/05_탭기능&for반복문.css" />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <!-- 카드레이아웃_js 생성 -->
      </div>
    </div>

    <div class="container">
      <button class="btn btn-danger" id="more">
        더보기
      </button>
    </div>

    <!-- 부트스트랩 라이브러리 -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- 제이쿼리 라이브러리 -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>

    <script src="./js/05_탭기능&for반복문.js"></script>

    <script>
      let count = 0; // 더보기 버튼을 누른 횟수를 저장하는 변수

      // 처음에 보여줄 상품 목록 (배열 형태)
      let products = [
        { id: 0, price: 70000, title: "Blossom Dress" },
        { id: 1, price: 50000, title: "Springfield Shirt" },
        { id: 2, price: 60000, title: "Black Monastery" },
      ];

      // 상품을 화면에 추가하는 함수
      function productList(data) {
        const row = document.querySelector(".row"); // 상품이 들어갈 공간 선택

        // 배열에 있는 상품 하나씩 가져와서 화면에 추가
        data.forEach((v) => {
          row.insertAdjacentHTML(
            "beforeend",
            `<div class="col-sm-4">
                <img src="./img/300.png" class="w-100"> 
                <h5>${v.title}</h5> 
                <p>가격 : ${v.price}</p>
            </div>`
          );
        });
      }

      // 처음 페이지가 열릴 때 기본 상품 3개를 화면에 추가
      productList(products);

      // "더보기" 버튼을 눌렀을 때 추가 상품을 가져오는 함수
      function getMore() {
        count++; // 버튼을 누를 때마다 숫자 1씩 증가

        let url = ""; // 데이터를 가져올 주소를 저장할 변수

        if (count === 1) {
          url = "https://codingapple1.github.io/js/more1.json"; // 4~6번째 상품 가져오기
        } else if (count === 2) {
          url = "https://codingapple1.github.io/js/more2.json"; // 7~9번째 상품 가져오기
        } else {
          document.getElementById("more").style.display = "none"; // 더 이상 상품이 없으니 버튼 숨김
          return;
        }

        // 서버에서 상품 데이터를 가져오는 코드
        fetch(url) // url에 있는 데이터 가져오기
          .then((response) => response.json()) // 가져온 데이터를 JSON 형식으로 변환
          .then((data) => productList(data)) // 변환된 데이터를 화면에 추가
          .catch((error) =>
            console.error("데이터를 불러오는 중 오류 발생:", error)
          ); // 오류 발생 시 콘솔에 출력
      }

      // "더보기" 버튼을 클릭하면 getMore 함수 실행하도록 설정
      document.querySelector("#more").addEventListener("click", getMore);
    </script>
  </body>
</html>
