    <script>
      //✅ 자바스크립트 ver.
    window.addEventListener('scroll', function() {
      var h = window.scrollY; // 스크롤 위치
      console.log(h);
    
      // 1. 카드박스1, 카드박스2 투명도 조절
      var y1 = (1 / -300) * h + 1000 / 300;
      var y2 = (1 / -300) * h + 1600 / 300;
    
      var cardBox1 = document.querySelectorAll('.card-box')[0];
      var cardBox2 = document.querySelectorAll('.card-box')[1];
    
      cardBox1.style.opacity = y1;
      cardBox2.style.opacity = y2;
    
      // 2. 카드박스1, 카드박스2 크기 조절
      var s1 = (-2 / 3000) * h + 44 / 30;
      var s2 = Math.min(Math.max((-1 / 3000) * h + 44 / 30, 0.9), 1); // 최소 0.9, 최대 1 유지
    
      if (h >= 700 && h <= 1000) {
        cardBox1.style.transform = `scale(${s1})`;
      } else {
        cardBox1.style.transform = 'scale(1)';
      }
    
      if (h >= 1500 && h <= 1800) { // 범위 조정
        cardBox2.style.transform = `scale(${s2})`;
      } else {
        cardBox2.style.transform = 'scale(1)';
      }
    });
  </script>
