    <!-- 부트스트랩 라이브러리 -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- 제이쿼리 라이브러리 -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>

    <script src="./js/05_탭기능&for반복문.js"></script>

    <script>
      let Products = [
        { id: 0, price: 70000, title: "Blossom Dress" },
        { id: 1, price: 50000, title: "Springfield Shirt" },
        { id: 2, price: 30000, title: "Black Monastery" },
      ];

      Products.forEach((product) => {
        let card = document.createElement("div");
        card.classList.add("card");
        card.innerHTML = `
          <div class="card-body">
            <img src="./img/300.png">
            <h5>${product.title}</h5>
            <p>가격 : ${product.price}</p>
            <button class="btn btn-danger">주문하기</button>
          </div>
        `;
        document.querySelector(".card-group").appendChild(card);
      });
    </script>

    <script>
      // ✅ ajax 로 get 요청하는 법(서버에서 데이터 받아오기)_jQuery ver.
      $.get('https://codingapple1.github.io/price.json').done(function (data) {
      console.log("ajax 요청 :" + data.price);
      }).fail(function () {
        console.log("ajax 요청 실패");});
    </script>

    <script>
      // ✅ ajax 로 get 요청하는 법(서버에서 데이터 받아오기)_javascript ver.
      fetch('https://codingapple1.github.io/price.json')
      .then(res => res.json()) // 받아온 json 데이터를 (object)객체로 변환
      .then(data => {
        console.log("fetch 요청 :" + data.price);
      })
      .catch((error) => {
        console.log("fetch 요청 실패");
      });

    </script>
  </body>
