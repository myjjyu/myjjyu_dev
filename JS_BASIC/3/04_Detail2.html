<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>서브메뉴_classList다루기</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/05_탭기능&for반복문.css" />
  </head>
  <body>
    <div class="container mt-3">
      <div class="card p-3">
        <span>상품명</span>
        <span>가격</span>
        <span>컬러</span>
      </div>
    </div>

    <form class="container my-5 form-grop">
      <p>상품선택</p>
      <select class="form-select mt-2">
        <option>모자</option>
        <option>셔츠</option>
        <option>바지</option>
      </select>
      <select class="form-select mt-2 form-hide">
        <!-- 셔츠 & 바지 option 태그를 for문으로 출력 -->
      </select>
      <button class="btn btn-primary mt-3">주문하기</button>
    </form>

    <div class="container mt-5">
      <ul class="list">
        <li class="tab-button">Products</li>
        <li class="tab-button orange">Information</li>
        <li class="tab-button">Shipping</li>
      </ul>
      <div class="tab-content">
        <p>상품설명입니다. Product</p>
      </div>
      <div class="tab-content show">
        <p>스펙설명입니다. Information</p>
      </div>
      <div class="tab-content">
        <p>배송정보입니다. Shipping</p>
      </div>
    </div>
    <!-- 부트스트랩 라이브러리 -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- 제이쿼리 라이브러리 -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>

    <script src="./js/05_탭기능&for반복문.js"></script>

    <script>
      let car2 = {
        name: "아우디",
        price: [50000, 40000, 30000],
        color: "black",
      };
      document.querySelector(".card").innerHTML = `
         <span>${car2.name}</span>
         <span>${car2.price[2]}</span>
         <span>${car2.color}</span>
         `;
    </script>

    <script>
      let shirts = ["S", "M", "L"];
      let pants = [28, 30, 32, 34, 36];

      /**
       * ✅  for문 사용
       * /
      // document
      //   .querySelector(".form-select")
      //   .addEventListener("input", function () {
      //     let sizeSelect = document.querySelectorAll(".form-select")[1];
      //     let value = this.value;

      //     sizeSelect.innerHTML = ""; // 기존 옵션 초기화

      //     if (value === "셔츠") {
      //       for (let i = 0; i < shirts.length; i++) {
      //         sizeSelect.innerHTML += `<option>${shirts[i]}</option>`;
      //       }

      //       sizeSelect.classList.remove("form-hide");
      //     } else if (value === "바지") {
      //       for (let j = 0; j < pants.length; j++) {
      //         sizeSelect.innerHTML += `<option>${pants[j]}</option>`;
      //       }
      //       sizeSelect.classList.remove("form-hide");
      //     } else {
      //       sizeSelect.classList.add("form-hide");
      //     }
      //   });
      */

      /**
       * ✅  forEach문 사용
       */
      document
        .querySelectorAll(".form-select")[0]
        .addEventListener("input", function () {
          let value = document.querySelectorAll(".form-select")[0].value;
          let sizeSelect = document.querySelectorAll(".form-select")[1];
          sizeSelect.innerHTML = ""; // 기존 옵션 초기화

          if (value == "셔츠") {
            sizeSelect.classList.remove("form-hide");
            shirts.forEach(function (a) {
              sizeSelect.innerHTML += `<option>${a}</option>`;
            });
          } else if (value == "바지") {
            sizeSelect.classList.remove("form-hide");
            pants.forEach(function (a) {
              sizeSelect.innerHTML += `<option>${a}</option>`;
            });
          } else {
            sizeSelect.classList.add("form-hide");
          }
        });
    </script>
  </body>
</html>
