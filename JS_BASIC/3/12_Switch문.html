<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>switch</title>
  </head>
  <body>
    <div id="quiz">
      <h4>물에 빠지면 누구먼저 구할거야?</h4>
      <button>남편</button>
      <button>부모님</button>
      <button>친구</button>
    </div>

    <script>
      document
        .querySelector("#quiz")
        .addEventListener("click", function (e) {
          switch(e.target.innerHTML){
            case "남편":
              alert("남편사랑");
              break;
            case "부모님":
              alert("부모님사랑");
              break;
            case "친구":
              alert("우정최고");
              break;
          }
        });
    </script>
  </body>
</html>
