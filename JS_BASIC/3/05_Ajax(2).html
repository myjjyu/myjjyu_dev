<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>서브메뉴_classList다루기</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/05_탭기능&for반복문.css" />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <!-- <div class="col-sm-4">
          <img src="https://via.placeholder.com/600" class="w-100">
          <h5>Card title</h5>
          <p>가격 : 70000</p>
        </div> -->
        <!-- 카드레이아웃_js 생성 -->
      </div>
    </div>

    <div class="container">
      <button class="btn btn-danger" id="more" onclick="getmore()">
        더보기
      </button>
    </div>

    <!-- 부트스트랩 라이브러리 -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- 제이쿼리 라이브러리 -->
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>

    <script src="./js/05_탭기능&for반복문.js"></script>

    <script>
      let cnt = 0; //더보기 버튼을 누른 횟수
      let products = [
        { id: 0, price: 70000, title: "Blossom Dress" },
        { id: 1, price: 50000, title: "Springfield Shirt" },
        { id: 2, price: 60000, title: "Black Monastery" },
      ];

      //배열을 파라미터로 넣어주면 배열에 있는 상품들을 출력해주는 함수
      function productList(data) {
        //요청 성공시 실행되는 함수
        data.forEach((v) => {
          //받아온 배열을 forEach로 각 데이터를 추가해준다
          $(".row").append(`<div class="col-sm-4">
            <img src="./img/300.png" class="w-100">
            <h5>${v.title}</h5>
            <p>가격 : ${v.price}</p>
        </div>`);
        });
      }

      //1,2,3 번째 상품 출력
      productList(products);

      // https://codingapple1.github.io/js/more1.json   여기로 get 요청을 보내면
      // 4,5,6번째 상품 3개를 array로 받을 수 있다

      //더보기 버튼을 한번더 누르면
      // https://codingapple1.github.io/js/more2.json   여기로 get 요청을 보내면
      // 7,8,9번째 상품 3개를 array로 받을 수 있다

      //더보기 버튼을 눌렀을때 get 요청을 통해 상품정보를 가져오는 함수
      function getmore() {
        cnt++;
        if (cnt == 1) {
          //버튼을 한번 눌렀을때만 작동하게 한다
          //요청보냄
          $.get("https://codingapple1.github.io/js/more1.json").done(function (
            data
          ) {
            productList(data);
          });
        } else if (cnt == 2) {
          // 버튼을 두번째 눌렀을때만 작동하게 한다
          //요청보냄
          $.get("https://codingapple1.github.io/js/more2.json").done(function (
            data
          ) {
            productList(data);
          });

          //더보기 버튼을 눌러도 더이상 상품이 없으므로 더보기 버튼을 안보기게함
          $(".btn").css("display", "none");
        }
      }
    </script>
  </body>
</html>
